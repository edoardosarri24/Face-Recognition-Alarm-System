name: Deploy to NAS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy Stack on Local NAS
    runs-on: self-hosted
    steps:
      - name: Pull Latest Changes and Recreate Containers
        run: |
          cd /volume1/docker/Face-Recognition-Alarm-System
          git pull origin main
          docker compose up -d --remove-orphans

