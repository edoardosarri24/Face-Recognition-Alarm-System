- id: 'door_breach_face_recognition'
  alias: 'Allarme Porta e Riconoscimento Facciale (Grace Period)'
  trigger:
    - platform: state
      entity_id: binary_sensor.main_door_contact
      to: 'on'
  action:
    # Logica Grace Period: 7 secondi per completare l'inferenza AI
    - wait_for_trigger:
        - platform: mqtt
          topic: double-take/matches/main_door
      timeout: '00:00:07'
      continue_on_timeout: true
    - choose:
        - conditions:
            - condition: template
              # Verifica se il messaggio MQTT è arrivato in tempo e il volto NON è sconosciuto
              value_template: >
                {{ wait.trigger != none and wait.trigger.payload_json.unknown == false }}
          sequence:
            - service: lock.unlock
              target:
                entity_id: lock.main_door
            - service: notify.mobile_app
              data:
                message: "Bentornato, {{ wait.trigger.payload_json.match.name }}!"
      default:
        - service: alarm_control_panel.alarm_trigger
          target:
            entity_id: alarm_control_panel.home_alarm
        - service: notify.mobile_app
          data:
            message: "Intruso rilevato o timeout del riconoscimento!"
            data:
              image: "http://<FRIGATE_IP>:5000/api/events/{{ wait.trigger.payload_json.id if wait.trigger != none else 'latest' }}/snapshot.jpg"
